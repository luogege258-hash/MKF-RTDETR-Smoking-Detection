# RT-DETR Enhanced (Ch3 Full): AMKF + ESRFPN + EPLA
# E04: Full precision enhancement (backbone + neck + encoder)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4
  - [-1, 1, ConvNormLayer, [128, 3, 2, None, False, 'relu']] # 5-P3/8 transition
  - [-1, 2, AMKF, [128, True, 1, 0.5]] # 6 Stage3 C2f-AMKF
  - [-1, 1, ConvNormLayer, [256, 3, 2, None, False, 'relu']] # 7-P4/16 transition
  - [-1, 2, AMKF, [256, True, 1, 0.5]] # 8 Stage4 C2f-AMKF
  - [-1, 1, ConvNormLayer, [512, 3, 2, None, False, 'relu']] # 9-P5/32 transition
  - [-1, 2, AMKF, [512, True, 1, 0.5]] # 10 Stage5 C2f-AMKF

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 11 S5 projection: 512 -> 256
  - [-1, 1, TransformerEncoderLayer_EPLA, [1024, 8]] # 12 S5_prime, N=25x25=625
  - [[6, 8, 12], 1, ESRFPN, [256]] # 13 [P3, P4, P5]
  - [-1, 1, GetIndexOutput, [0]] # 14 P3: 100x100x256
  - [-2, 1, GetIndexOutput, [1]] # 15 P4: 50x50x256
  - [-3, 1, GetIndexOutput, [2]] # 16 P5: 25x25x256
  - [[14, 15, 16], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
