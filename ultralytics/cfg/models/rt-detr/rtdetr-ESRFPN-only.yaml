# RT-DETR with ESRFPN neck only
# E05: Neck enhancement only (ESRFPN replaces RepC3)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 S5 projection: 512 -> 256
  - [-1, 1, AIFI, [1024, 8]] # 9 S5_prime
  - [[5, 6, 9], 1, ESRFPN, [256]] # 10 [P3, P4, P5]
  - [-1, 1, GetIndexOutput, [0]] # 11 P3: 100x100x256
  - [-2, 1, GetIndexOutput, [1]] # 12 P4: 50x50x256
  - [-3, 1, GetIndexOutput, [2]] # 13 P5: 25x25x256
  - [[11, 12, 13], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
