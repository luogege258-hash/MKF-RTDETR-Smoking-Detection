# RT-DETR with CSB backbone + CSFPN neck
# E08: Lightweight backbone + neck

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4

  - [-1, 2, CSB, [64]] # 2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P3/8
  - [-1, 3, CSB, [128]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P4/16
  - [-1, 3, CSB, [256]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32
  - [-1, 1, CSB, [512]] # 8

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 3, CSFPN, [256, 0.5]]  # 15 CSFPN replaces RepC3
  - [-1, 1, Conv, [256, 1, 1]]   # 16, Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 19
  - [-1, 3, CSFPN, [256, 0.5]]    # X3 (20) CSFPN

  - [-1, 1, Conv, [256, 3, 2]]   # 21
  - [[-1, 16], 1, Concat, [1]]  # 22
  - [-1, 3, CSFPN, [256, 0.5]]    # F4 (23) CSFPN

  - [-1, 1, Conv, [256, 3, 2]]   # 24
  - [[-1, 11], 1, Concat, [1]]  # 25
  - [-1, 3, CSFPN, [256, 0.5]]    # F5 (26) CSFPN

  - [[20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
